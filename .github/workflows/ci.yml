name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: splatpack selftest
      - run: splatpack-heatmap selftest
      - run: splatpack demo demo_out --splats 1200 --fit-samples 1000 --rff 8 --fractions 0 0.05 0.20

  windows-cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - name: Create tiny PLY fixture
        shell: pwsh
        run: |
          @'
          ply
          format ascii 1.0
          element vertex 4
          property float x
          property float y
          property float z
          property float nx
          property float ny
          property float nz
          property uchar red
          property uchar green
          property uchar blue
          end_header
          0 0 0 0 0 0 255 0 0
          1 0 0 0 0 0 220 20 0
          0 1 0 0 0 0 0 255 0
          0 0 1 0 0 0 0 0 255
          '@ | Set-Content -Encoding ascii windows_test.ply
      - name: Exact repo-root analyze command must execute, not open splatpack.py
        shell: cmd
        run: splatpack analyze windows_test.ply
      - name: RGB residual heatmap command must execute
        shell: cmd
        run: splatpack-heatmap windows_test.ply windows_visual --rff 1
